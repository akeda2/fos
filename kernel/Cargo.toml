[package]
name = "fosfor-kernel"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"

[dependencies]
fosfor-abi = { path = "../abi" }
fosfor-fat = { path = "../crates/fat" }
fosfor-tape-sync = { path = "../crates/tape-sync" }

# Deliberate-fault builds for the exception tests (make test-faults): each one
# provokes one kind of fault right after boot so the report can be checked.
[features]
fault-null = []
fault-text-write = []
fault-nx = []
fault-stack = []
fault-ud = []
