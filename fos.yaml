defaults:
  queue-mode: serial
jobs:
- name: fos-cleanup
  active: true
  path: ~/dev/fos
  run-mode: scheduled
  build: make clean
  at: "06:00"
- name: fos
  active: true
  path: ~/dev/fos
  pre-build: which gb && gb -I fos.yaml -a -w 
  test:
    - export PATH=$HOME/.cargo/bin:$HOME/.local/bin:$PATH && make all -j16
    - export PATH=$HOME/.cargo/bin:$HOME/.local/bin:$PATH && make test-all TEST_JOBS=8
  interval: 1800