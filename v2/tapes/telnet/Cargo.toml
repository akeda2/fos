[package]
name = "telnet-tape"
version = "0.1.0"
edition = "2024"

[lib]
name = "telnet_tape"
path = "src/lib.rs"

[[bin]]
name = "telnet"
path = "src/main.rs"

[dependencies]
# One source for the protocol library: v1 and v2 tapes share it (it is plain no_std Rust).
tape-net = { path = "../../../tapes/tape-net" }
tape-rt = { path = "../tape-rt" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
