[package]
name = "opus-codec"
version = "0.1.0"
edition = "2024"
description = "Rust FFI wrapper around a vendored libopus for v2 tapes"
license = "BSD-3-Clause"

[dependencies]
tape-rt = { path = "../tape-rt" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = "symbols"
