[package]
name = "audio-net"
version = "0.1.0"
edition = "2024"

[dependencies]
tape-rt = { path = "../tape-rt" }
audio-wire = { path = "../audio-wire" }
tape-panel = { path = "../tape-panel" }
tape-net = { path = "../../../tapes/tape-net" }
opus-codec = { path = "../opus-codec" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
