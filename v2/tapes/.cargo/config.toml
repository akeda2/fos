# Shared by every v2 tape crate under v2/tapes/ (cargo reads the nearest config upward
# from the crate directory): the 64-bit tape target, position-independent output, and
# the common linker script.
[build]
target = "../../targets/x86_64-fos-tape.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.x86_64-fos-tape]
rustflags = ["-C", "link-arg=-T../tape.ld", "-C", "relocation-model=pic", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker", "-C", "link-arg=-znorelro"]
