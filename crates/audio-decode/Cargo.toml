[package]
name = "audio-decode"
version = "0.1.0"
edition = "2024"
description = "Streaming audio file decoders for the media player (FLAC so far), reading through a Source"
license = "MIT"

[lib]
name = "audio_decode"
path = "src/lib.rs"

[profile.release]
panic = "abort"
opt-level = 3

[dependencies]
dsp = { path = "../dsp" }
nanomp3-core = { version = "0.2.0", default-features = false, features = ["layer12"] }

[features]
# Explicit SIMD in the MP3 decoder (the `wide` crate); off by default, see docs/design.md.
wide = ["nanomp3-core/wide"]
