[package]
name = "tape-net"
version = "0.1.0"
edition = "2024"
description = "Fixed-buffer Ethernet and Internet protocol helpers for fos tapes"
license = "MIT"

[lib]
test = true
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
