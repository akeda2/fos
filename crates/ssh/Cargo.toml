[package]
name = "ssh"
version = "0.1.0"
edition = "2024"
description = "A small SSH-2 server and SFTP v3 over any byte stream, for tapes: curve25519 key exchange, ssh-ed25519, chacha20-poly1305, public-key auth"
license = "MIT"

[lib]
name = "ssh"
path = "src/lib.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
subtle = { version = "2", default-features = false }
vfs-export = { path = "../vfs-export" }

[profile.release]
panic = "abort"
opt-level = "z"
