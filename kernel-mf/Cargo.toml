[package]
name = "fosfor-kernel-mf"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"

[dependencies]
fosfor-abi = { path = "../abi" }
fosfor-hal = { path = "../crates/fos-hal" }
fosfor-fat = { path = "../crates/fat" }
fosfor-kernel-core = { path = "../crates/kernel-core", features = ["vnic"] }
fosfor-shell = { path = "../crates/shell" }
fosfor-script = { path = "../crates/script" }
fosfor-tape-sync = { path = "../crates/tape-sync" }
