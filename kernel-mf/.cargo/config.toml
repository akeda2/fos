[build]
target = "../targets/x86_64-fos-kernel.json"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.x86_64-fos-kernel]
# The embedded kernel's image layout (a position-independent ELF the loader places and relocates), so both loaders load it
# unchanged: its linker script is shared, not copied.
rustflags = ["-C", "link-arg=-T../kernel/linker.ld", "-C", "relocation-model=pic", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker", "-C", "link-arg=-znorelro"]
