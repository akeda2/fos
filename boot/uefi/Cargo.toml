[package]
name = "fos-loader"
version = "0.1.0"
edition = "2024"

# The loader is a UEFI application (a PE/COFF image). There is no OS under it to
# unwind into, so panics abort, the same reasoning as every other crate here.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"

[dependencies]
fos-v2-abi = { path = "../../abi" }
