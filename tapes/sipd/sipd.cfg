# sipd: a SIP registrar and proxy for a small studio or lab.
# Copy to the machine as settings/sipd.cfg (foscopy.py sipd.cfg :settings/sipd.cfg), then
#   run sipd &2          (or: run sipd @sipd.cfg &2)
# Clients register as sip:NAME@10.0.0.5 with the password from sipusers.

# A fixed address: clients are told this one, so avoid DHCP here.
ip=10.0.0.5/24
gateway=10.0.0.1
# NIC number from 1; leave out to follow `nic use`.
nic=2
port=5060
realm=studio
# Lines of user:password, in settings/ (see sipusers.example).
users=sipusers
# Print registrations and refusals on the console.
log
