[package]
name = "longmode-tape-body"
version = "0.1.0"
edition = "2024"

# A `staticlib`, not a `bin` -- unlike every other Rust tape in this repo
# (hello-rs/vga-colors/bigsieve, which are each a whole, self-contained
# flat binary), this crate provides only `tape64_body`, one function
# meant to be linked into a larger image alongside
# tapes/longmode64_shim.S's hand-written 32-bit plumbing (CPUID check,
# page tables, GDT, the actual mode transition) -- see that file's header
# comment for the reusable contract this crate implements, and
# ../longmode.S for the equivalent function written in hand-written
# assembly instead. There is no `_start`, no linker script, and no entry
# point in this crate at all: `make tape-longmode-rs` links the compiled
# `.a` this produces directly against the shim's object file with
# `ld -T ../../tapes/longmode64.ld`, letting that shared linker script
# keep the shim first at 0x100000 and supply the one entry point the
# kernel ever calls (`tape_main`).
[lib]
crate-type = ["staticlib"]

# Same reasoning as every other tape/kernel Cargo.toml in this repo: no
# OS underneath to unwind to, so unwinding would have nothing useful to
# do (see src/lib.rs's panic handler).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
