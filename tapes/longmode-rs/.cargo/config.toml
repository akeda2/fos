[build]
# A brand new custom target, not a reuse of ../../targets/i686-fos.json:
# this crate is compiled to run as genuinely 64-bit-encoded code (once
# tapes/longmode64_shim.S has already switched the CPU into long mode),
# unlike every other Rust tape in this repo, which is ordinary 32-bit
# code for fos's normal protected-mode kernel. See
# ../../targets/x86_64-fos-tape.json's own placement/AGENTS.md's "A tape
# that visits 64-bit long mode and comes back (in Rust, modularly)"
# section for why its features disable SSE/MMX and enable soft-float:
# fos's CR4 setup never sets OSFXSR/OSXMMEXCPT (this kernel has no reason
# to use floating point at all), so any SSE-encoded instruction --
# including ones LLVM might otherwise emit for a plain struct copy, not
# just explicit float math -- would fault with #UD the instant it ran.
target = "../../targets/x86_64-fos-tape.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
