[package]
name = "kakelfix-tape"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kakelfix"
path = "src/main.rs"

[dependencies]
archive = { path = "../../crates/archive" }
audio-rec = { path = "../../crates/audio-rec" }
audio-screen = { path = "../../crates/audio-screen" }
dsp = { path = "../../crates/dsp" }
flac-enc = { path = "../../crates/flac-enc" }
tape-rt = { path = "../../crates/tape-rt", features = ["decode", "record"] }
fosfor-abi = { path = "../../abi" }
gfx = { path = "../../crates/gfx" }
instrument-rt = { path = "../../crates/instrument-rt" }
kakelfix = { path = "../../crates/kakelfix" }
audio-decode = { path = "../../crates/audio-decode" }
ltas = { path = "../../crates/ltas" }
mixer-model = { path = "../../crates/mixer-model" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 2
strip = "symbols"
