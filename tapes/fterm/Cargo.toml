[package]
name = "fterm"
version = "0.1.0"
edition = "2024"

[lib]
name = "fterm"
path = "src/lib.rs"

[[bin]]
name = "fterm"
path = "src/main.rs"

[dependencies]
tape-rt = { path = "../../crates/tape-rt" }
tape-net = { path = "../../crates/tape-net" }
tape-panel = { path = "../../crates/tape-panel" }
# The Telnet protocol pieces (option parser, IAC doubling, TCP frame builder) are shared with the telnet tape.
telnet-tape = { path = "../telnet" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
