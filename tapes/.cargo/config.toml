# Shared by every v2 tape crate under tapes/ (cargo reads the nearest config upward
# from the crate directory): the 64-bit tape target, position-independent output, and
# the common linker script.
[build]
target = "../targets/x86_64-fos-tape.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.x86_64-fos-tape]
rustflags = ["-C", "link-arg=-T../tape.ld", "-C", "relocation-model=pic", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker", "-C", "link-arg=-znorelro"]

# The hard-float target for tapes that do DSP (`tapes/NAME/.cargo/config.toml` points `build.target` at it). The kernel
# turns SSE on before such a tape starts (`TapeApi::fp_level`); only these tapes may use XMM registers.
[target.x86_64-fos-tape-fp]
rustflags = ["-C", "link-arg=-T../tape.ld", "-C", "relocation-model=pic", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker", "-C", "link-arg=-znorelro"]

# The aarch64 port (docs/aarch64-plan.md): the built-in hard-float bare-metal target, same linker script and PIE layout.
# Build with `make tape-aarch64`, which passes `--target aarch64-unknown-none`.
[target.aarch64-unknown-none]
rustflags = ["-C", "link-arg=-T../tape.ld", "-C", "relocation-model=pic", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker", "-C", "link-arg=-znorelro"]
