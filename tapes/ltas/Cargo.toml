[package]
name = "ltas-tape"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ltas"
path = "src/main.rs"

[dependencies]
tape-rt = { path = "../../crates/tape-rt" }
dsp = { path = "../../crates/dsp" }
gfx = { path = "../../crates/gfx" }
ltas = { path = "../../crates/ltas" }
noise = { path = "../../crates/noise" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 2
strip = "symbols"
