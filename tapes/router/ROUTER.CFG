# fos router configuration example
#
# Run this file with:
#
#   tape load disk ROUTER.BIN
#   tape run router @ROUTER.CFG
#
# Configuration words and interface entries may be separated by spaces or
# newlines. A '#' starts a comment through the end of its line.
#
# NIC numbers are one-based, matching "nic list".

# Obtain NIC 1's address, subnet mask, default gateway, and DNS servers from
# the upstream DHCP server. `dhcp` is the backward-compatible spelling for
# NIC 1; it is the first-priority uplink.
dhcp

# Add a standby DHCP uplink with `dhcp N` (one-based NIC number). Uplinks are
# tried in declaration order. To use this example, move the downstream LAN to
# NIC 3 below:
#
dhcp 2
#
# `health` selects the one ICMP echo target used after each uplink's gateway
# has answered ARP. Three missed bounded probe cycles fail over; recovery
# automatically returns traffic to the first healthy declared uplink.
#
health 1.1.1.1

# Masquerade TCP/UDP traffic from downstream interfaces when it leaves via
# NIC 1. This is enabled by default, but spelling it out makes the intended
# gateway behavior clear. Use "no-nat" instead when the upstream network has
# a route back to the downstream subnet and should see the original sources.
nat

# Add `quiet` to suppress routine DHCP/NAT events on an unattended router:
# quiet

# Permanently expose a downstream service through NIC 1. The syntax is:
#
#   forward tcp|udp EXTERNAL_PORT INTERNAL_IP [INTERNAL_PORT]
#
# Rules are bounded (16), and external ports and internal endpoints must be
# unique per protocol. The internal address must be on a configured
# non-primary subnet. If INTERNAL_PORT is omitted, EXTERNAL_PORT is used.
#
# Example: expose downstream web service 10.0.15.2:80 as upstream TCP 8080:
#
# forward tcp 8080 10.0.15.2 80
#forward tcp 8080 10.0.15.2 80
#forward udp 5353 10.0.15.2

# Run a DHCP server on every configured interface except DHCP uplinks.
#
# The server derives each pool from that interface's subnet, excludes the
# network address, broadcast address, and router address, and can allocate the
# complete usable address range subject to available lease-table memory.
dhcp-server

# Optional DNS override for downstream DHCP clients.
#
# Without this line, DNS servers supplied by upstream DHCP on NIC 1 are
# propagated automatically. With this line, these addresses are advertised
# instead. The router does not run DNS; these must be reachable external
# resolvers on the surrounding network.
#
# Example:
# dns 10.0.1.53 1.1.1.1

# Optional DHCP lease persistence. This asks the router tape to save bound
# MAC-to-address assignments in FOSFS. Omit this line for a diskless,
# memory-only DHCP server. If the configured file cannot be read or written,
# the router continues with ordinary in-memory leases.
#
# dhcp-lease-file DHCP.LEASES

# Configure the downstream LAN on NIC 3. NIC 2 is the standby DHCP uplink
# declared above.
#
# This compact CIDR form gives NIC 3 address 10.0.15.1 on subnet
# 10.0.15.0/24. DHCP clients on this interface receive addresses from the
# usable range, excluding 10.0.15.0, 10.0.15.1, and 10.0.15.255.
3 10.0.15.1/24

# Alternative interface syntax:
#
#   3 10.0.15.1 /24
#
# The older dotted-netmask syntax is also accepted:
#
#   3 10.0.15.1 255.255.255.0
#
# Do not enable all three forms at once; they are alternatives for the same
# interface entry.

# Optional explicit default route:
#
#   default 1 10.0.1.254
#
# With the "dhcp" word above, this is normally unnecessary: the active DHCP
# uplink's router option becomes the default gateway.
# An explicit default route overrides the DHCP-supplied route and must be on
# the selected interface's subnet.

# A static two-interface configuration would instead look like this:
#
#   dhcp-server
#   1 10.0.1.1/24
#   2 10.0.15.1/24
#
# In that form NIC 1 is static rather than DHCP-configured. Because no
# upstream DNS was learned, add an explicit "dns SERVER [SERVER]" line if
# downstream clients should receive DNS settings:
#
#   dns 10.0.1.53 1.1.1.1
#EDITED