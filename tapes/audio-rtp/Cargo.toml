[package]
name = "audio-rtp-tape"
version = "0.1.0"
edition = "2024"

[lib]
name = "audio_rtp_tape"
path = "src/lib.rs"
test = true
bench = false

[[bin]]
name = "audio-rtp-tape"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"

[dependencies]
tape-net = { path = "../tape-net" }

[target.'cfg(target_os = "none")'.dependencies]
tape-rt = { path = "../tape-rt" }
