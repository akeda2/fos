[package]
name = "ip-chat-tape"
version = "0.1.0"
edition = "2024"

[lib]
test = true
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"

[dependencies]
tape-net = { path = "../tape-net" }
tape-rt = { path = "../tape-rt" }
