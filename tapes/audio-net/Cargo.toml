[package]
name = "audio-net"
version = "0.1.0"
edition = "2024"

[dependencies]
tape-rt = { path = "../../crates/tape-rt" }
audio-wire = { path = "../../crates/audio-wire" }
tape-panel = { path = "../../crates/tape-panel" }
tape-net = { path = "../../crates/tape-net" }
tape-ip = { path = "../../crates/tape-ip" }
opus-codec = { path = "../../crates/opus-codec" }
ptp-tape = { path = "../ptp" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
