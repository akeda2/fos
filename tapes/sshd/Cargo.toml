[package]
name = "sshd-tape"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sshd"
path = "src/main.rs"

[dependencies]
ssh = { path = "../../crates/ssh" }
tape-ip = { path = "../../crates/tape-ip" }
tape-net = { path = "../../crates/tape-net" }
tape-rt = { path = "../../crates/tape-rt" }
vfs-export = { path = "../../crates/vfs-export" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"

# The ciphers and curves are the hot path of a transfer; size matters less than speed here.
[profile.release.package."*"]
opt-level = 3
