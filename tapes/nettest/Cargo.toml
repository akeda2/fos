[package]
name = "nettest"
version = "0.1.0"
edition = "2024"

# The engine (lib.rs, host-testable) and the tape (main.rs) in one crate.
[lib]
name = "nettest_tape"
path = "src/lib.rs"

[[bin]]
name = "nettest"
path = "src/main.rs"

[dependencies]
tape-rt = { path = "../../crates/tape-rt" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
