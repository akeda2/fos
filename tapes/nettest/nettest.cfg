# Example configuration for the nettest tape:  tape run nettest @nettest.cfg
# (also installed on every image as "nettest.cfg"). One setting per line, '#'
# starts a comment, at most 4096 bytes. Every line is optional.
#
# The two NICs to put the link between, as numbered by `nic list`:
1 2

# A whole profile for one direction. ab is NIC 1 -> NIC 2, ba the reverse.
# Presets: badwifi wifi cellular satellite dsl (type "presets" at the prompt).
preset ab badwifi

# Individual settings, per direction or (without ab/ba) for both:
loss ba 2
#delay 40 10         # 40 ms +- 10 ms
#rate 1000           # kbit/s, with a queue
#queue 64            # frames in flight before tail drop
#dup 1               # percent delivered twice
#reorder 2           # percent swapped with the next frame
#corrupt 0.5         # percent with one payload bit flipped

# The same random choices every run:
seed 42

# Show the live statistics panel from the start:
#view=on
