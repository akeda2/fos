[package]
name = "organ-tape"
version = "0.1.0"
edition = "2024"

[lib]
name = "organ_tape"
path = "src/lib.rs"

[[bin]]
name = "organ"
path = "src/main.rs"

[dependencies]
audio-sample = { path = "../../crates/audio-sample" }
audio-screen = { path = "../../crates/audio-screen" }
gfx = { path = "../../crates/gfx" }
organ = { path = "../../crates/organ" }
tape-rt = { path = "../../crates/tape-rt" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 2
strip = "symbols"
